<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Ad Blocker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:360px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#1a1a2e;color:#e0e0e0;padding:16px}
.header{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #2a2a4a}
.header img{width:32px;height:32px}
.header h1{font-size:15px;font-weight:600}
.header .badge{font-size:10px;background:#e94560;color:white;padding:2px 6px;border-radius:10px;margin-left:auto}

.toggle-row{display:flex;align-items:center;justify-content:space-between;background:#16213e;border-radius:8px;padding:12px;margin-bottom:12px;border:1px solid #2a2a4a}
.toggle-label{font-size:13px;font-weight:600}
.toggle-label small{display:block;font-size:10px;color:#888;font-weight:400;margin-top:2px}
.toggle{position:relative;width:44px;height:24px;cursor:pointer}
.toggle input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#3a3a5a;border-radius:24px;transition:.3s}
.slider:before{content:"";position:absolute;height:18px;width:18px;left:3px;top:3px;background:#e0e0e0;border-radius:50%;transition:.3s}
input:checked+.slider{background:#e94560}
input:checked+.slider:before{transform:translateX(20px)}

.status{display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:12px;color:#888}
.status.on{color:#4ade80}
.status .dot{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.page-stat{background:#16213e;border-radius:10px;padding:20px 12px;text-align:center;margin-bottom:8px;border:1px solid #2a2a4a}
.page-stat .number{font-size:42px;font-weight:800;color:#e94560;line-height:1.1}
.page-stat .label{font-size:11px;color:#888;margin-top:6px}

.total-row{display:flex;align-items:center;gap:8px;background:#12182b;border-radius:8px;padding:9px 12px;margin-bottom:12px;border:1px solid #22223a;cursor:pointer;font-size:11px;color:#888;transition:border-color .2s}
.total-row:hover{border-color:#e94560}
.total-row .total-label{font-weight:600}
.total-row .total-number{font-size:14px;font-weight:700;color:#bbb}
.total-row .total-hint{margin-left:auto;font-size:10px;color:#555}

.log-panel{display:none;background:#16213e;border:1px solid #2a2a4a;border-radius:8px;margin-bottom:12px;overflow:hidden}
.log-panel.open{display:block}
.log-head{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid #2a2a4a}
.log-title{font-size:11px;font-weight:600;color:#e94560}
.log-close{flex:0 0 auto;background:none;border:none;color:#888;font-size:14px;cursor:pointer;padding:0 4px}
.log-close:hover{color:#e94560;opacity:1}
.log-list{list-style:none;max-height:260px;overflow-y:auto}
.log-list li{padding:6px 10px;border-bottom:1px solid #1f1f38;cursor:pointer}
.log-list li:last-child{border-bottom:none}
.log-list li:hover{background:#1a2440}
.log-time{font-size:9px;color:#666;margin-bottom:2px}
.log-url{font-size:10px;color:#9ab;line-height:1.4;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.log-list li.open .log-url{display:block;overflow:visible}
.log-empty{padding:16px !important;text-align:center;color:#666 !important;cursor:default !important}
.log-empty:hover{background:transparent !important}

.actions{display:flex;gap:8px;margin-bottom:10px}
button{flex:1;padding:9px;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;transition:opacity .2s}
button:hover{opacity:.85}
button.secondary{background:#2a2a4a;color:#e0e0e0}
button.primary{background:#0f3460;color:white}

.footer{font-size:10px;color:#666;text-align:center;padding-top:10px;border-top:1px solid #2a2a4a}
</style>
</head>
<body>
<div class="header">
<img src="icon48.png" alt="icon">
<h1>YouTube Ad Blocker</h1>
<span class="badge">v1.2</span>
</div>

<div class="toggle-row">
<span class="toggle-label">광고 차단<small id="toggleStatus">활성화됨</small></span>
<label class="toggle">
<input type="checkbox" id="enabledToggle" checked>
<span class="slider"></span>
</label>
</div>

<div class="status" id="statusText">
<span class="dot"></span><span>유튜브에서 자동으로 적용됩니다</span>
</div>

<div class="page-stat" id="pageStat">
<div class="number" id="pageBlocked">0</div>
<div class="label">현재 사이트 누적 차단</div>
</div>

<div class="total-row" id="totalCard" title="클릭하면 차단된 주소 목록을 표시합니다">
<span class="total-label">총 차단</span>
<span class="total-number" id="totalBlocked">0</span>
<span class="total-hint">목록 보기</span>
</div>

<div class="log-panel" id="logPanel">
<div class="log-head">
<span class="log-title">차단된 주소</span>
<button class="log-close" id="logClose">✕</button>
</div>
<ul class="log-list" id="logList"></ul>
</div>

<div class="actions">
<button class="secondary" id="resetBtn">통계 재설정</button>
<button class="primary" id="optionsBtn">설정</button>
</div>

<div class="footer">
YouTube 광고 차단 확장 프로그램
</div>

<script src="popup.js"></script>
</body>
</html>
