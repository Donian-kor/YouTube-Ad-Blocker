<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Ad Blocker - 설정</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 480px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 24px;
    }
    h2 { font-size: 18px; margin-bottom: 20px; color: #fff; }
    .section { margin-bottom: 24px; }
    .section h3 {
      font-size: 13px;
      color: #e94560;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat-card {
      background: #16213e;
      border-radius: 8px;
      padding: 14px;
      text-align: center;
      border: 1px solid #2a2a4a;
    }
    .stat-card .number { font-size: 24px; font-weight: 700; color: #e94560; }
    .stat-card .label { font-size: 11px; color: #888; margin-top: 4px; }
    .total-box {
      background: #16213e;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      margin-bottom: 16px;
      border: 1px solid #2a2a4a;
    }
    .total-box .number { font-size: 32px; font-weight: 700; color: #e94560; }
    .total-box .label { font-size: 12px; color: #888; margin-top: 4px; }
    .btn-row { display: flex; gap: 8px; margin-top: 16px; }
    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
    button.danger { background: #e94560; color: white; }
    button.primary { background: #0f3460; color: white; }
    .info {
      font-size: 11px;
      color: #666;
      line-height: 1.6;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #2a2a4a;
    }
  </style>
</head>
<body>
  <h2>YouTube Ad Blocker 설정</h2>

  <div class="section">
    <h3>통계</h3>
    <div class="total-box">
      <div class="number" id="optTotal">0</div>
      <div class="label">차단된 총 광고</div>
    </div>
    <div class="stat-grid">
      <div class="stat-card">
        <div class="number" id="optNetwork">0</div>
        <div class="label">네트워크 차단</div>
      </div>
      <div class="stat-card">
        <div class="number" id="optDom">0</div>
        <div class="label">DOM 제거</div>
      </div>
      <div class="stat-card">
        <div class="number" id="optReset">-</div>
        <div class="label">마지막 재설정</div>
      </div>
    </div>
    <div class="btn-row">
      <button class="danger" id="optResetBtn">통계 재설정</button>
    </div>
  </div>

  <div class="section">
    <h3>동작 방식</h3>
    <div class="info">
      <p>• <b>네트워크 차단</b>: declarativeNetRequest API로 광고 요청을 블록</p>
      <p>• <b>DOM 제거</b>: 이미 로드된 광고 요소를 제거</p>
      <p>• YouTube의 정책 변화로 인해 완전한 차단은 어려울 수 있습니다.</p>
      <p>• 광고를 시청하지 않으면 일부 콘텐츠 재생이 제한될 수 있습니다.</p>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
